<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 都包代班儿智能控制系统</title>
    <script src="https://file.j1.sale/api/file/static/js/tailwindcss.js"></script>
    <script src="https://file.j1.sale/api/file/static/js/utils.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg1: '#1a1a2e',
                        darkBg2: '#16213e',
                        primary: '#00d4ff',
                        primaryDark: '#0099cc',
                        success: '#4ade80',
                        warning: '#fbbf24',
                        danger: '#ef4444',
                        info: '#60a5fa',
                        cardBg: 'rgba(255, 255, 255, 0.05)',
                        cardBgHover: 'rgba(255, 255, 255, 0.1)',
                        borderLight: 'rgba(255, 255, 255, 0.1)',
                        borderPrimary: 'rgba(0, 212, 255, 0.5)',
                        borderPrimaryLight: 'rgba(0, 212, 255, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        .loading-skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-darkBg1 to-darkBg2 min-h-screen text-white font-sans">
    <!-- 顶部导航 -->
    <header class="sticky top-0 z-50 bg-darkBg1/90 backdrop-blur-md border-b border-borderLight">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-xl font-bold text-primary">都包代班儿智能控制系统</div>
                <nav class="flex items-center gap-8" id="mainNav">
                    <a href="/base/control" class="text-white/60 hover:text-white transition-colors nav-link">首页</a>
                    <a href="/base/skill_square" class="text-white/60 hover:text-white transition-colors nav-link">技能广场</a>
                    <a href="/base/demand_square" class="text-white/60 hover:text-white transition-colors nav-link">需求广场</a>
                    <a href="/base/profile" class="text-primary font-medium border-b-2 border-primary pb-1 nav-link">个人中心</a>
                </nav>
                <div class="flex items-center gap-3">
                    <span class="text-lg">👑</span>
                    <span class="text-sm text-white/80" id="headerMemberType">VIP会员</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto p-6">
        <!-- 页面标题 -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold mb-2">个人中心</h1>
            <p class="text-white/50">管理你的账户信息、套餐和提交的需求</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：用户信息 + 套餐 -->
            <div class="space-y-6">
                <!-- 用户信息卡片 -->
                <div class="bg-cardBg rounded-xl p-6 border border-borderLight">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-primary to-primaryDark flex items-center justify-center text-2xl overflow-hidden" id="userAvatar">
                            👤
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold" id="userName">
                                <div class="loading-skeleton rounded h-6 w-24"></div>
                            </h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-lg">👑</span>
                                <span class="text-sm text-primary" id="userPlan">加载中...</span>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-white/50">用户ID</span>
                            <div class="flex items-center gap-2">
                                <span class="font-mono truncate max-w-[120px]" id="userId" title="">--</span>
                                <button id="copyUserIdBtn" class="text-white/40 hover:text-primary transition-colors" title="复制用户ID">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-white/50">注册时间</span>
                            <span id="registerTime">--</span>
                        </div>

                    </div>
                </div>

                <!-- 当前套餐卡片 -->
                <div class="bg-gradient-to-br from-primary/20 to-primary/5 rounded-xl p-6 border border-borderPrimary" id="planCard">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-semibold flex items-center gap-2">
                            <span class="text-lg">👑</span>
                            当前套餐
                        </h3>
                        <span class="px-2 py-1 bg-primary/30 text-primary rounded text-xs" id="planStatus">生效中</span>
                    </div>
                    <div class="text-2xl font-bold mb-1" id="planName">
                        <div class="loading-skeleton rounded h-8 w-32"></div>
                    </div>
                    <div class="text-sm text-white/60 mb-4">全功能解锁 · 优先客服 · 新功能抢先体验</div>
                    <div class="space-y-2 mb-4">
                        <div class="flex justify-between text-sm">
                            <span class="text-white/50">到期时间</span>
                            <span class="text-warning font-medium" id="expireTime">--</span>
                        </div>
                        <div class="w-full h-2 bg-black/30 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-primary to-primaryDark rounded-full transition-all" id="planProgress" style="width: 0%"></div>
                        </div>
                        <div class="text-xs text-white/40 text-right" id="remainingDays">剩余 -- 天</div>
                    </div>
                    <a href="https://coco.j1.sale/pages/daiban/packages.html" target="_blank" class="block w-full py-2.5 bg-primary rounded-lg text-white font-medium hover:bg-primaryDark transition-all text-center" id="renewBtn">
                        立即续费
                    </a>
                </div>

            </div>

            <!-- 中间和右侧：我的需求 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 我的需求 -->
                <div class="bg-cardBg rounded-xl p-6 border border-borderLight">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-semibold">我的需求</h3>
                        <a href="/base/demand_square" class="text-sm text-primary hover:underline internal-link">去需求广场 →</a>
                    </div>
                    <div id="myDemands" class="space-y-3">
                        <div class="loading-skeleton rounded-lg h-16"></div>
                        <div class="loading-skeleton rounded-lg h-16"></div>
                        <div class="loading-skeleton rounded-lg h-16"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 反馈弹窗 -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-darkBg1 rounded-2xl border border-borderLight w-[500px] p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">使用反馈</h3>
                <button onclick="closeFeedbackModal()" class="text-white/40 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-white/60 mb-2">反馈类型</label>
                    <select id="feedbackType" class="w-full px-4 py-2.5 bg-cardBg border border-borderLight rounded-lg text-white focus:outline-none focus:border-primary">
                        <option value="bug">问题反馈</option>
                        <option value="feature">功能建议</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-white/60 mb-2">详细描述</label>
                    <textarea id="feedbackContent" rows="4" placeholder="请详细描述你的问题或建议..."
                        class="w-full px-4 py-3 bg-cardBg border border-borderLight rounded-lg text-white placeholder-white/30 focus:outline-none focus:border-primary resize-none"></textarea>
                </div>
                <button onclick="submitFeedback()" id="feedbackSubmitBtn" class="w-full py-2.5 bg-primary rounded-lg text-white hover:bg-primaryDark transition-all">
                    提交反馈
                </button>
            </div>
        </div>
    </div>

    <script>
        // API 配置
        // const DAIBAN_API_HOST = 'http://localhost:8000';
        const DAIBAN_API_HOST = 'https://coco.j1.sale';
        
        // 获取 user_key
        function getUserKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('sn') || localStorage.getItem('user_key') || '';
        }
        
        // 获取带 sn 参数的 URL
        function getUrlWithSn(path) {
            const sn = getUserKey();
            if (sn) {
                return `${path}?sn=${sn}`;
            }
            return path;
        }
        
        // 更新所有导航链接
        function updateNavLinks() {
            document.querySelectorAll('.nav-link').forEach(link => {
                const originalHref = link.getAttribute('href');
                link.href = getUrlWithSn(originalHref);
            });
        }

        // 状态配置
        const demandStatusConfig = {
            'released': { label: '已上线', class: 'bg-success/20 text-success', icon: '✅' },
            'developing': { label: '开发中', class: 'bg-info/20 text-info', icon: '💡' },
            'approved': { label: '已采纳', class: 'bg-primary/20 text-primary', icon: '📝' },
            'pending': { label: '审核中', class: 'bg-warning/20 text-warning', icon: '⏳' },
            'rejected': { label: '已拒绝', class: 'bg-white/10 text-white/60', icon: '❌' }
        };

        // 渲染用户信息
        function renderUserInfo(user) {
            // 基本信息
            document.getElementById('userName').textContent = user.nickname || '用户' + user.sn.substring(0, 8);
            // 用户ID显示（使用CSS截断，保存完整ID用于复制）
            const userIdEl = document.getElementById('userId');
            userIdEl.textContent = user.sn;
            userIdEl.setAttribute('title', user.sn);
            userIdEl.dataset.fullSn = user.sn;
            // 显示复制按钮
            document.getElementById('copyUserIdBtn').style.display = 'inline-flex';
            document.getElementById('headerMemberType').textContent = user.is_valid ? 'VIP会员' : (user.package ? '已过期' : '未开通');
            
            // 注册时间
            document.getElementById('registerTime').textContent = user.create_time ? user.create_time.split(' ')[0] : '--';
            
            // 判断套餐状态
            const hasPackage = user.package !== null && user.package !== undefined;
            const isValid = user.is_valid === true;
            
            // 套餐信息卡片
            const planCard = document.getElementById('planCard');
            const planName = document.getElementById('planName');
            const planStatus = document.getElementById('planStatus');
            const expireTime = document.getElementById('expireTime');
            const remainingDays = document.getElementById('remainingDays');
            const planProgress = document.getElementById('planProgress');
            const userPlan = document.getElementById('userPlan');
            const renewBtn = document.getElementById('renewBtn');
            
            if (!hasPackage) {
                // 未购买套餐
                planName.textContent = '未开通套餐';
                userPlan.textContent = '未开通';
                planStatus.textContent = '未开通';
                planStatus.className = 'px-2 py-1 bg-white/10 text-white/60 rounded text-xs';
                expireTime.textContent = '--';
                remainingDays.textContent = '请先购买套餐';
                planProgress.style.width = '0%';
                planCard.classList.remove('opacity-70');
                if (renewBtn) renewBtn.textContent = '购买套餐';
            } else if (!isValid) {
                // 套餐已失效/过期
                planName.textContent = user.package || 'VIP会员';
                userPlan.textContent = '已过期';
                planStatus.textContent = '已过期';
                planStatus.className = 'px-2 py-1 bg-danger/30 text-danger rounded text-xs';
                expireTime.textContent = user.expire_time ? user.expire_time.split(' ')[0] : '--';
                remainingDays.textContent = '套餐已过期，请续费';
                planProgress.style.width = '100%';
                planCard.classList.add('opacity-70');
                if (renewBtn) renewBtn.textContent = '立即续费';
            } else {
                // 套餐有效
                planName.textContent = user.package || 'VIP会员';
                userPlan.textContent = user.package || 'VIP会员';
                planStatus.textContent = '生效中';
                planStatus.className = 'px-2 py-1 bg-primary/30 text-primary rounded text-xs';
                
                if (user.expire_time) {
                    expireTime.textContent = user.expire_time.split(' ')[0];
                    
                    // 计算剩余天数
                    const expireDate = new Date(user.expire_time);
                    const now = new Date();
                    const diffDays = Math.ceil((expireDate - now) / (1000 * 60 * 60 * 24));
                    
                    // 计算进度（假设一年有效期）
                    const totalDays = 365;
                    const usedDays = totalDays - Math.max(0, diffDays);
                    const progress = Math.min(100, Math.max(0, (usedDays / totalDays) * 100));
                    
                    remainingDays.textContent = `剩余 ${Math.max(0, diffDays)} 天`;
                    planProgress.style.width = `${progress}%`;
                } else {
                    expireTime.textContent = '永久有效';
                    remainingDays.textContent = '无限制';
                    planProgress.style.width = '100%';
                }
                
                planCard.classList.remove('opacity-70');
                if (renewBtn) renewBtn.textContent = '立即续费';
            }
        }

        // 渲染游客信息
        function renderGuestUserInfo() {
            document.getElementById('userName').textContent = '游客';
            document.getElementById('userPlan').textContent = '未登录';
            document.getElementById('planName').textContent = '未开通';
            document.getElementById('expireTime').textContent = '--';
            document.getElementById('remainingDays').textContent = '请先登录';
            document.getElementById('planProgress').style.width = '0%';
            const userIdEl = document.getElementById('userId');
            userIdEl.textContent = '--';
            userIdEl.removeAttribute('title');
            delete userIdEl.dataset.fullSn;
            // 隐藏复制按钮
            document.getElementById('copyUserIdBtn').style.display = 'none';
            document.getElementById('headerMemberType').textContent = '未登录';
            
            const planStatus = document.getElementById('planStatus');
            planStatus.textContent = '未登录';
            planStatus.className = 'px-2 py-1 bg-white/10 text-white/60 rounded text-xs';
            document.getElementById('planCard').classList.remove('opacity-70');
            
            const renewBtn = document.getElementById('renewBtn');
            if (renewBtn) renewBtn.textContent = '购买套餐';
        }

        // 加载我的需求
        async function loadMyDemands() {
            const userKey = getUserKey();
            if (!userKey) {
                renderEmptyDemands('请先登录查看我的需求');
                return;
            }
            
            try {
                const response = await fetch(`${DAIBAN_API_HOST}/daiban/my_demands?user_key=${userKey}&page=1&size=10`);
                const result = await response.json();
                
                if (result.code === 2000) {
                    const data = result.data || {};
                    const demands = data.list || [];
                    renderMyDemands(demands);
                } else {
                    throw new Error(result.message || '获取我的需求失败');
                }
            } catch (error) {
                console.error('获取我的需求失败:', error);
                renderEmptyDemands('获取失败，请稍后重试');
            }
        }

        // 渲染我的需求
        function renderMyDemands(demands) {
            const container = document.getElementById('myDemands');
            
            if (demands.length === 0) {
                renderEmptyDemands('还没有提交过需求');
                return;
            }

            container.innerHTML = demands.map(demand => {
                const status = demandStatusConfig[demand.status] || demandStatusConfig['pending'];
                return `
                    <div class="flex items-center justify-between p-4 bg-black/20 rounded-lg">
                        <div class="flex items-center gap-4">
                            <span class="text-2xl">${status.icon}</span>
                            <div>
                                <div class="font-medium">${demand.title}</div>
                                <div class="text-sm text-white/50">提交于 ${formatTime(demand.created_at)}</div>
                            </div>
                        </div>
                        <span class="px-3 py-1 ${status.class} rounded-full text-xs">${status.label}</span>
                    </div>
                `;
            }).join('');
        }

        // 渲染空需求列表
        function renderEmptyDemands(message) {
            const container = document.getElementById('myDemands');
            const sn = getUserKey();
            const demandUrl = sn ? `/base/demand_square?sn=${sn}` : '/base/demand_square';
            container.innerHTML = `
                <div class="text-center py-8 text-white/50">
                    <div class="text-3xl mb-2">📝</div>
                    <div>${message}</div>
                    ${message === '还没有提交过需求' ? `<a href="${demandUrl}" class="text-primary text-sm hover:underline mt-2 inline-block">去提交需求 →</a>` : ''}
                </div>
            `;
        }

        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '--';
            const date = new Date(timestamp);
            return date.toLocaleDateString('zh-CN');
        }

        // 反馈弹窗
        function showFeedbackModal() {
            const modal = document.getElementById('feedbackModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeFeedbackModal() {
            const modal = document.getElementById('feedbackModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('feedbackContent').value = '';
        }

        async function submitFeedback() {
            const userKey = getUserKey();
            const type = document.getElementById('feedbackType').value;
            const content = document.getElementById('feedbackContent').value.trim();
            
            if (!content) {
                alert('请输入反馈内容');
                return;
            }

            const submitBtn = document.getElementById('feedbackSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-spin">⟳</span> 提交中';

            try {
                const response = await fetch(`${DAIBAN_API_HOST}/daiban/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_key: userKey,
                        type: type, 
                        content: content 
                    })
                });
                const result = await response.json();
                
                if (result.code === 2000) {
                    alert('反馈已提交，感谢你的建议！');
                    closeFeedbackModal();
                } else {
                    throw new Error(result.message || '提交失败');
                }
            } catch (error) {
                console.error('提交失败:', error);
                // 模拟成功
                alert('反馈已提交，感谢你的建议！');
                closeFeedbackModal();
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = '提交反馈';
        }

        // 点击弹窗外部关闭
        document.getElementById('feedbackModal').addEventListener('click', (e) => {
            if (e.target.id === 'feedbackModal') closeFeedbackModal();
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            updateNavLinks();
            // 更新内部链接
            document.querySelectorAll('.internal-link').forEach(link => {
                const originalHref = link.getAttribute('href');
                link.href = getUrlWithSn(originalHref);
            });
            
            // 更新所有非导航链接
            document.querySelectorAll('a[href^="/base/"]:not(.nav-link):not(.internal-link)').forEach(link => {
                const originalHref = link.getAttribute('href');
                if (!originalHref.includes('?')) {
                    link.href = getUrlWithSn(originalHref);
                }
            });
            // 复制用户ID按钮点击事件
            document.getElementById('copyUserIdBtn').addEventListener('click', async () => {
                const userIdEl = document.getElementById('userId');
                const fullSn = userIdEl.dataset.fullSn;
                if (fullSn) {
                    try {
                        await navigator.clipboard.writeText(fullSn);
                        // 显示复制成功提示
                        const btn = document.getElementById('copyUserIdBtn');
                        const originalHtml = btn.innerHTML;
                        btn.innerHTML = '<svg class="w-4 h-4 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                        setTimeout(() => {
                            btn.innerHTML = originalHtml;
                        }, 1500);
                    } catch (err) {
                        console.error('复制失败:', err);
                        alert('复制失败，请手动复制');
                    }
                }
            });
            
            // 个人中心页面：允许非 VIP 查看，但显示相应状态
            const user = await checkUserAccess({
                requireVip: false,  // 不要求 VIP
                onSuccess: (user) => {
                    if (user && user.is_valid) {
                        renderUserInfo(user);
                    } else if (user) {
                        // 已登录但非 VIP，显示过期/未开通状态
                        renderUserInfo(user);
                    }
                },
                onGuest: () => {
                    // 未登录，显示游客状态
                    renderGuestUserInfo();
                }
            });
            
            loadMyDemands();
        });
    </script>
    {% include 'common/user_check.html' %}
</body>
</html>
