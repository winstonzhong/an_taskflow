<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>都包代班儿智能控制系统 - 首页</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://file.j1.sale/api/file/static/js/tailwindcss.js"></script>
    <!-- 配置 Tailwind 自定义颜色和工具类 -->
    <script src="https://file.j1.sale/api/file/static/js/utils.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg1: '#1a1a2e',
                        darkBg2: '#16213e',
                        primary: '#00d4ff',
                        primaryDark: '#0099cc',
                        success: '#4ade80',
                        warning: '#fbbf24',
                        danger: '#ef4444',
                        info: '#60a5fa',
                        cardBg: 'rgba(255, 255, 255, 0.05)',
                        cardBgHover: 'rgba(255, 255, 255, 0.1)',
                        borderLight: 'rgba(255, 255, 255, 0.1)',
                        borderPrimary: 'rgba(0, 212, 255, 0.5)',
                        borderPrimaryLight: 'rgba(0, 212, 255, 0.3)',
                    },
                    animation: {
                        pulse: 'pulse 1s infinite',
                    },
                    keyframes: {
                        pulse: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.3' },
                        }
                    },
                    width: {
                        'phone': '280px',
                    }
                }
            }
        }
    </script>
    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .backdrop-blur-10 {
                backdrop-filter: blur(10px);
            }
            .inset-4 {
                top: 4px;
                right: 4px;
                bottom: 4px;
                left: 4px;
            }
            .script-active::after {
                content: "✓";
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: theme('colors.success');
                font-size: 14px;
            }
            .script-pending::after {
                content: "⟳";
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: theme('colors.warning');
                font-size: 14px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% { transform: translateY(-50%) rotate(0deg); }
                100% { transform: translateY(-50%) rotate(360deg); }
            }
            .inset-0 {
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
            }
            .robot-btn-pending::after {
                content: "⟳";
                margin-left: 4px;
                font-size: 12px;
                animation: spin 1s linear infinite;
            }
            .config-modal {
                backdrop-filter: blur(10px);
            }
        }
        
        /* 截图停止提示覆盖层 */
        .screenshot-stopped-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 12px;
            animation: fadeIn 0.3s ease-out;
        }
        
        .stopped-content {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        
        .stopped-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .stopped-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }
        
        .stopped-subtext {
            font-size: 1rem;
            color: #9ca3af;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-darkBg1 to-darkBg2 min-h-screen text-white font-sans">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-40 bg-darkBg1/90 backdrop-blur-md border-b border-borderLight">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-xl font-bold text-primary">都包代班儿智能控制系统</div>
                <nav class="flex items-center gap-8" id="mainNav">
                    <a href="/base/control" class="text-primary font-medium border-b-2 border-primary pb-1 nav-link">首页</a>
                    <a href="/base/skill_square" class="text-white/60 hover:text-white transition-colors nav-link">技能广场</a>
                    <a href="/base/demand_square" class="text-white/60 hover:text-white transition-colors nav-link">需求广场</a>
                    <a href="/base/profile" class="text-white/60 hover:text-white transition-colors nav-link">个人中心</a>
                </nav>
                <div class="flex items-center gap-3">
                    <span class="text-lg">👑</span>
                    <span class="text-sm text-white/80" id="headerMemberType">VIP会员</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto p-6">
        <h1 class="text-center mb-8 text-2xl text-primary">设备控制台</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-[300px_1fr_320px] gap-5 items-start">
            <!-- 左侧：脚本列表 + 配置 -->
            <div class="bg-cardBg rounded-xl p-5 border border-borderLight">
                <div class="flex justify-between items-center text-sm text-white/60 mb-4 uppercase tracking-wider">
                    <span>技能列表</span>
                    <div class="flex items-center gap-2">
                        <a href="/base/skill_square" class="text-primary hover:text-primaryDark transition-colors text-xs flex items-center gap-1 p-1.5 hover:bg-white/5 rounded internal-link" title="前往技能广场">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                            </svg>
                        </a>
                        <button class="refresh-btn text-primary hover:text-primaryDark transition-colors text-xs flex items-center gap-1" id="refreshSkillsBtn">
                            <span>↻</span>
                            <span>刷新</span>
                        </button>
                    </div>
                </div>
                
                <!-- 技能列表 -->
                <div class="max-h-[400px] overflow-y-auto flex flex-col gap-2.5 mb-4 pr-1" id="scriptList" data-page="1" data-loading="false">
                    <!-- 技能卡片将通过JS动态加载 -->
                </div>

                <!-- 连接信息 -->
                <div class="connection-info p-3.5 bg-black/30 rounded-lg">
                    <div class="flex justify-between text-xs mb-2">
                        <span class="text-white/50">状态</span>
                        <span class="text-primary font-mono" id="connStatus">未连接</span>
                    </div>
                    <div class="flex justify-between text-xs mb-2">
                        <span class="text-white/50">帧率</span>
                        <span class="text-primary font-mono" id="fpsDisplay">0 FPS</span>
                    </div>
                    <div class="flex justify-between text-xs mb-2">
                        <span class="text-white/50">延迟</span>
                        <span class="text-primary font-mono" id="latencyDisplay">-- ms</span>
                    </div>
                    <button class="connect-btn w-full py-2.5 bg-gradient-to-r from-primary to-primaryDark rounded-lg text-white font-medium cursor-pointer transition-all hover:-translate-y-1 hover:shadow-lg hover:shadow-primary/30 disabled:bg-white/10 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none" id="connectBtn">连接服务器</button>
                    <button class="robot-btn w-full py-2.5 mt-2 bg-gradient-to-r from-success to-green-600 rounded-lg text-white font-medium cursor-pointer transition-all hover:-translate-y-1 hover:shadow-lg hover:shadow-success/30 disabled:bg-white/10 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none" id="robotBtn" disabled>启动机器人</button>
                </div>
            </div>

            <!-- 中间：手机屏幕 -->
            <div class="phone-container flex flex-col items-center w-full">
                <div class="phone-frame w-phone h-[560px] bg-gray-900 rounded-[32px] border-4 border-gray-800 overflow-hidden relative shadow-2xl shadow-black/50">
                    <div class="phone-screen absolute inset-4 rounded-[28px] bg-black overflow-hidden">
                        <!-- 连接状态指示 -->
                        <div class="connection-status absolute top-2.5 right-2.5 flex items-center gap-2 z-10">
                            <span class="fps-badge bg-black/60 px-2 py-1 rounded-full text-xs text-success hidden" id="fpsBadge">0 FPS</span>
                            <div class="status-dot w-2 h-2 rounded-full bg-danger" id="statusDot"></div>
                        </div>

                        <!-- 控制结果提示 -->
                        <div class="control-result absolute top-12 left-1/2 -translate-x-1/2 bg-black/80 px-4 py-2 rounded-full text-xs opacity-0 transition-opacity duration-300" id="controlResult"></div>

                        <!-- 截图显示 -->
                        <img class="screenshot-img absolute inset-0 w-full h-full object-contain bg-black hidden" id="screenshotImg" alt="手机屏幕">

                        <!-- 未连接状态 -->
                        <div class="no-connection absolute inset-0 flex flex-col items-center justify-center text-white/40" id="noConnection">
                            <div class="no-connection-icon w-15 h-15 border-2 border-white/20 rounded-full mb-3.5 flex items-center justify-center text-2xl">📱</div>
                            <div id="connectMsg">未连接设备</div>
                        </div>
                    </div>
                </div>

                <!-- 控制按钮栏 -->
                <div class="control-bar flex gap-2.5 mt-5 p-2.5 px-4 bg-cardBg rounded-full backdrop-blur-10">
                    <button class="control-btn w-10 h-10 border-none bg-cardBg rounded-full text-white cursor-pointer text-lg transition-all flex items-center justify-center hover:bg-cardBgHover hover:scale-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" id="btnBack" title="返回" disabled>↩</button>
                    <button class="control-btn w-10 h-10 border-none bg-cardBg rounded-full text-white cursor-pointer text-lg transition-all flex items-center justify-center hover:bg-cardBgHover hover:scale-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" id="btnHome" title="主页" disabled>⌂</button>
                    <button class="control-btn w-10 h-10 border-none bg-cardBg rounded-full text-white cursor-pointer text-lg transition-all flex items-center justify-center hover:bg-cardBgHover hover:scale-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" id="btnRecent" title="多任务" disabled>▢</button>
                    <div class="w-0.5 h-6 bg-white/20 mx-1.25"></div>
                    <button class="control-btn w-10 h-10 border-none bg-cardBg rounded-full text-white cursor-pointer text-lg transition-all flex items-center justify-center hover:bg-cardBgHover hover:scale-110 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed" id="btnScreenshot" title="截图" disabled>📷</button>
                </div>
            </div>

            <!-- 右侧：日志 -->
            <div class="bg-cardBg rounded-xl p-5 border border-borderLight">
                <div class="text-sm text-white/60 mb-4 uppercase tracking-wider">执行日志</div>
                <div class="log-container h-[400px] overflow-y-auto font-mono text-xs leading-relaxed" id="logContainer">
                    <div class="log-entry py-1 border-b border-white/5">
                        <span class="log-time text-white/40 mr-2">--:--:--</span>
                        <span class="log-info text-info">等待连接...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 配置弹窗 - 三栏式配置编辑器 -->
    <div id="configModal" class="config-modal fixed inset-0 bg-black/70 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#1a1d29] rounded-xl border border-[#2d3142] w-[1100px] h-[720px] flex flex-col shadow-2xl overflow-hidden">
            <!-- 弹窗头部 -->
            <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-[#232636] to-[#1e2130] border-b border-[#2d3142]">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-[#6366f1]/20 flex items-center justify-center">
                        <svg class="w-4 h-4 text-[#6366f1]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-base font-semibold text-white/90">配置管理</h3>
                        <p class="text-xs text-white/40 mt-0.5"><span id="configSkillName" class="text-[#818cf8]"></span></p>
                    </div>
                </div>
                <button onclick="closeConfig()" class="w-8 h-8 flex items-center justify-center rounded-lg text-white/40 hover:text-white hover:bg-white/5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- 弹窗主体 - 三栏布局 -->
            <div class="flex flex-1 overflow-hidden">
                <!-- 左侧：键名列表 -->
                <div class="w-[260px] border-r border-[#2d3142] flex flex-col bg-[#1e2130]">
                    <div class="p-4 border-b border-[#2d3142]">
                        <div class="flex items-center justify-between">
                            <h4 class="text-[13px] font-medium text-white/60 uppercase tracking-wider">配置项</h4>
                            <div class="relative">
                                <button onclick="showAddKeyMenu()" class="flex items-center gap-1.5 px-3 py-1.5 bg-[#6366f1] hover:bg-[#5558e0] text-white rounded-md transition-all text-xs font-medium">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    新建
                                </button>
                                <!-- 新增键值菜单 -->
                                <div id="addKeyMenu" class="hidden absolute right-0 top-full mt-1 bg-[#252a3d] border border-[#3d4252] rounded-lg shadow-xl py-1 min-w-[120px] z-20">
                                    <button onclick="addNewKey('text')" class="w-full px-4 py-2 text-left text-sm text-white/70 hover:bg-[#6366f1]/20 hover:text-white transition-colors flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-[#10b981]"></span>
                                        文本
                                    </button>
                                    <button onclick="addNewKey('object')" class="w-full px-4 py-2 text-left text-sm text-white/70 hover:bg-[#6366f1]/20 hover:text-white transition-colors flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full bg-[#f59e0b]"></span>
                                        键值对
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="keyList" class="flex-1 overflow-y-auto p-2 space-y-1">
                        <!-- 动态渲染键名列表 -->
                    </div>
                </div>

                <!-- 中间：编辑区 -->
                <div class="flex-1 flex flex-col bg-[#161822]">
                    <div id="editorHeader" class="p-5 border-b border-[#2d3142] hidden">
                        <div class="flex items-start justify-between gap-4 mb-3">
                            <input type="text" id="currentKeyName" 
                                class="flex-1 bg-transparent text-lg font-semibold text-white border-none focus:outline-none focus:ring-0 placeholder-white/20"
                                placeholder="输入配置项名称">
                            <span id="currentKeyType" class="px-2.5 py-1 rounded-md text-[11px] font-medium flex-shrink-0"></span>
                        </div>
                        <input type="text" id="currentKeyDesc" 
                            class="w-full bg-[#1e2130] border border-[#2d3142] rounded-md px-3 py-2 text-[13px] text-white/60 focus:border-[#6366f1]/50 focus:outline-none transition-colors"
                            placeholder="添加描述...">
                    </div>
                    <div id="editorContent" class="flex-1 overflow-y-auto p-5">
                        <!-- 编辑内容 -->
                        <div id="emptyEditor" class="h-full flex items-center justify-center">
                            <div class="text-center">
                                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-[#252a3d] flex items-center justify-center">
                                    <svg class="w-8 h-8 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                </div>
                                <p class="text-white/30 text-sm">从左侧选择一个配置项进行编辑</p>
                                <p class="text-white/20 text-xs mt-1">或点击「新建」创建配置项</p>
                            </div>
                        </div>
                        <!-- 文本编辑器 -->
                        <div id="textEditor" class="hidden h-full flex flex-col">
                            <textarea id="textValue" 
                                class="flex-1 w-full bg-[#1e2130] border border-[#2d3142] rounded-lg p-4 text-[14px] text-white/90 focus:border-[#6366f1]/50 focus:outline-none resize-none font-mono leading-relaxed placeholder-white/20"
                                placeholder="输入配置内容..."></textarea>
                        </div>
                        <!-- 键值对编辑器 -->
                        <div id="objectEditor" class="hidden space-y-3">
                            <div id="kvList" class="space-y-2">
                                <!-- 动态渲染键值对 -->
                            </div>
                            <button onclick="addKVPair()" class="w-full py-2.5 border border-dashed border-[#3d4252] rounded-lg text-white/40 hover:text-[#6366f1] hover:border-[#6366f1]/50 hover:bg-[#6366f1]/5 transition-all flex items-center justify-center gap-2 text-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                添加键值对
                            </button>
                        </div>
                    </div>
                    <!-- 编辑区底部操作栏 -->
                    <div id="editorFooter" class="px-5 py-3 border-t border-[#2d3142] hidden bg-[#1a1d29]">
                        <div class="flex items-center justify-between">
                            <button onclick="deleteCurrentKey()" class="flex items-center gap-2 px-3 py-1.5 text-[#ef4444]/80 hover:text-[#ef4444] hover:bg-[#ef4444]/10 rounded-md transition-all text-xs">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                                删除
                            </button>
                            <div class="flex items-center gap-3">
                                <span id="saveStatus" class="text-xs text-[#10b981] hidden flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                    已保存
                                </span>
                                <button onclick="saveCurrentConfig()" class="flex items-center gap-2 px-4 py-2 bg-[#6366f1] hover:bg-[#5558e0] text-white rounded-md transition-all text-xs font-medium">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                                    </svg>
                                    保存配置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧：历史记录 -->
                <div class="w-[240px] flex flex-col bg-[#1e2130] border-l border-[#2d3142]">
                    <div class="px-4 py-3 border-b border-[#2d3142]">
                        <div class="flex items-center gap-2">
                            <svg class="w-3.5 h-3.5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <h4 class="text-[13px] font-medium text-white/60 uppercase tracking-wider">历史记录</h4>
                        </div>
                    </div>
                    <div id="historyList" class="flex-1 overflow-y-auto p-2 space-y-2">
                        <div id="emptyHistory" class="text-center py-8">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-[#252a3d] flex items-center justify-center">
                                <svg class="w-5 h-5 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <p class="text-white/30 text-xs">暂无历史</p>
                        </div>
                        <!-- 动态渲染历史记录 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const req = new http()
        let localHost = window.location.hostname
        let currentConfigSkill = null;
        const DAIBAN_API_HOST = 'https://coco.j1.sale';
        
        // 获取 user_key (从 URL 参数 sn)
        function getUserKey() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('sn') || localStorage.getItem('user_key') || '';
        }
        
        // 获取带 sn 参数的 URL
        function getUrlWithSn(path) {
            const sn = getUserKey();
            if (sn) {
                return `${path}?sn=${sn}`;
            }
            return path;
        }
        
        // 更新所有导航链接
        function updateNavLinks() {
            document.querySelectorAll('.nav-link').forEach(link => {
                const originalHref = link.getAttribute('href');
                link.href = getUrlWithSn(originalHref);
            });
        }

        // 配置数据缓存
        let skillConfigs = {};

        function setAllScriptsDisabled() {
            // 只禁用卡片内容区域（抄选区域），配置按钮保持可点击
            document.querySelectorAll('.script-card-content').forEach(content => {
                content.style.pointerEvents = 'none';
            });
            document.querySelectorAll('.script-card').forEach(card => {
                card.classList.add('script-disabled');
            });
        }

        function setAllScriptsEnable() {
            document.querySelectorAll('.script-card-content').forEach(content => {
                content.style.pointerEvents = 'auto';
            });
            document.querySelectorAll('.script-card').forEach(card => {
                card.classList.remove('script-disabled');
            });
        }

        function setAllScriptsPending(isPending) {
            document.querySelectorAll('.script-card').forEach(card => {
                if (isPending) {
                    card.classList.add('script-pending');
                    // 只禁用内容区域，保留配置按钮可点击
                    const content = card.querySelector('.script-card-content');
                    if (content) content.style.pointerEvents = 'none';
                } else {
                    card.classList.remove('script-pending');
                    const content = card.querySelector('.script-card-content');
                    if (content) content.style.pointerEvents = 'auto';
                }
            });
        }

        // ==================== WebSocket 客户端实现 ====================
        class WebSocketClient {
            constructor(url) {
                this.url = url;
                this.ws = null;
                this.connectionState = 'disconnected';
                this.frameCount = 0;
                this.frameTimes = [];
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.reconnectInterval = 3000;
                this.onScreenshot = null;
                this.onControlResult = null;
                this.onError = null;
                this.onConnect = null;
                this.onDisconnect = null;
                this.onScriptStatusUpdate = null;
                this.onRobotStatusUpdate = null;
                this.isManualDisconnect = false;
                this.wsName = 'front';
                this.robotState = 'stopped';
            }

            connect() {
                if (this.ws?.readyState === WebSocket.OPEN) return;
                updateConnectMsg('已连接, 等待数据传输')

                this.isManualDisconnect = false;
                this.connectionState = 'connecting';
                this.updateStatus();
                setAllScriptsEnable()
                
                try {
                    this.ws = new WebSocket(this.url);

                    this.ws.onopen = () => {
                        console.log('[WebSocket] 连接成功');
                        this.connectionState = 'connected';
                        this.reconnectAttempts = 0;
                        this.updateStatus();
                        this.sendQueryRobotStatusCmd()
                        this.onConnect?.();
                    };

                    this.ws.onmessage = (event) => {
                        if (event.data instanceof Blob) {
                            this.handleScreenshot(event.data);
                        } else if (event.data instanceof ArrayBuffer) {
                            const blob = new Blob([event.data], { type: 'image/jpeg' });
                            this.handleScreenshot(blob);
                        } else if (typeof event.data === 'string') {
                            this.handleTextMessage(event.data);
                        }
                    };

                    this.ws.onclose = () => {
                        console.log('[WebSocket] 连接关闭');
                        updateConnectMsg('未连接设备')
                        this.connectionState = 'disconnected';
                        this.robotState = 'stopped';
                        this.updateStatus();
                        this.onDisconnect?.();
                        this.onRobotStatusUpdate?.(this.robotState);
                        this.ws = null;
                        setAllScriptsPending(false);

                        if (!this.isManualDisconnect && this.reconnectAttempts < this.maxReconnectAttempts) {
                            this.reconnectAttempts++;
                            log(`尝试第${this.reconnectAttempts}次重连...`, 'warn');
                            setTimeout(() => this.connect(), this.reconnectInterval);
                        }
                    };

                    this.ws.onerror = (error) => {
                        console.error('[WebSocket] 错误:', error);
                        this.connectionState = 'error';
                        this.updateStatus();
                        this.onError?.(error);
                        setAllScriptsPending(false);
                    };
                } catch (err) {
                    console.error('[WebSocket] 创建连接失败:', err);
                    this.connectionState = 'error';
                    this.updateStatus();
                    setAllScriptsPending(false);
                }
            }

            updateRobotState(newState) {
                this.robotState = newState;
                this.onRobotStatusUpdate?.(newState);
                this.updateRobotBtnStatus();
            }

            updateRobotBtnStatus() {
                const robotBtn = document.getElementById('robotBtn');
                if (!robotBtn) return;

                robotBtn.classList.remove('from-success', 'to-green-600', 'from-danger', 'to-red-600', 'from-warning', 'to-amber-600', 'robot-btn-pending');
                robotBtn.disabled = this.connectionState !== 'connected';

                switch (this.robotState) {
                    case 'starting':
                        robotBtn.textContent = '启动中';
                        robotBtn.classList.add('from-warning', 'to-amber-600', 'robot-btn-pending');
                        robotBtn.disabled = true;
                        break;
                    case 'running':
                        robotBtn.textContent = '停止机器人';
                        robotBtn.classList.add('from-danger', 'to-red-600');
                        break;
                    case 'stopping':
                        robotBtn.textContent = '停止中';
                        robotBtn.classList.add('from-warning', 'to-amber-600', 'robot-btn-pending');
                        robotBtn.disabled = true;
                        break;
                    case 'stopped':
                    default:
                        robotBtn.textContent = '启动机器人';
                        robotBtn.classList.add('from-success', 'to-green-600');
                        break;
                }
            }

            sendStartRobotCmd() {
                if (this.ws?.readyState !== WebSocket.OPEN) {
                    log('连接未就绪，无法发送启动机器人指令', 'error');
                    return false;
                }
                this.updateRobotState('starting');
                // 启动机器人时隐藏截图停止提示
                this.hideScreenshotStoppedOverlay();
                const msg = { type: 'start_robot', robot_id: 1 };
                this.ws.send(JSON.stringify(msg));
                log('发送启动机器人指令', 'info');
                return true;
            }

            sendQueryRobotStatusCmd() {
                if (this.ws?.readyState !== WebSocket.OPEN) {
                    return false;
                }
                const msg = { type: 'query_robot_status', robot_id: 1 };
                this.ws.send(JSON.stringify(msg));
                return true;
            }

            sendStopRobotCmd() {
                if (this.ws?.readyState !== WebSocket.OPEN) {
                    log('连接未就绪，无法发送停止机器人指令', 'error');
                    return false;
                }
                this.updateRobotState('stopping');
                const msg = { type: 'stop_robot', robot_id: 1 };
                this.ws.send(JSON.stringify(msg));
                log('发送停止机器人指令', 'info');
                return true;
            }

            sendSingleScriptStatus(scriptName, isActive) {
                const card = document.querySelector(`[data-script="${scriptName}"]`);
                if (card) card.classList.add('script-pending');

                if (this.ws?.readyState !== WebSocket.OPEN) {
                    log('连接未就绪，无法发送脚本状态更新', 'error');
                    if (card) card.classList.remove('script-pending');
                    return false;
                }

                const msg = {
                    name: this.wsName,
                    type: 'group_switch',
                    data_type: 'single',
                    selected: [],
                    unselected: [],
                    timestamp: Date.now(),
                };
                isActive ? msg.selected.push(scriptName) : msg.unselected.push(scriptName)
                this.ws.send(JSON.stringify(msg));
                log(`更新脚本状态: ${scriptName} - ${isActive ? '启用' : '禁用'}`, 'info');
                return true;
            }

            clearScriptPending(scriptName) {
                const card = document.querySelector(`[data-script="${scriptName}"]`);
                if (card) {
                    card.classList.remove('script-pending');
                    const content = card.querySelector('.script-card-content');
                    if (content) content.style.pointerEvents = 'auto';
                }
            }

            clearScriptsPending(scriptNames) {
                if (!Array.isArray(scriptNames)) return;
                scriptNames.forEach(name => this.clearScriptPending(name));
            }

            disconnect() {
                if (this.ws) {
                    this.isManualDisconnect = true;
                    this.ws.close();
                    this.ws = null;
                }
                setAllScriptsPending(false);
            }

            handleScreenshot(blob) {
                const now = Date.now();
                this.frameTimes.push(now);
                this.frameTimes = this.frameTimes.filter(t => now - t < 1000);
                this.frameCount++;

                const fps = this.frameTimes.length;
                document.getElementById('fpsBadge').textContent = `${fps} FPS`;
                document.getElementById('fpsDisplay').textContent = `${fps} FPS`;

                this.onScreenshot?.(blob);
            }

            handleTextMessage(data) {
                try {
                    const msg = JSON.parse(data);
                    switch (msg.type) {
                        case 'group_switch_result':
                            log(`脚本状态更新完成: ${JSON.stringify(msg.group_status_data)}`, 'success');
                            const updatedScriptNames = Object.keys(msg.group_status_data || {});
                            this.clearScriptsPending(updatedScriptNames);
                            this.onScriptStatusUpdate?.(msg.group_status_data);
                            break;
                        case 'robot_status':
                            log(`机器人状态更新: ${msg.state}`, msg.state === 'running' ? 'success' : 'info');
                            if (msg.success === true) {
                                this.updateRobotState(msg.state);
                            }
                            // 如果机器人已停止且截图也已停止，显示截图停止提示
                            if (msg.state === 'stopped' && msg.screenshot_stopped) {
                                this.showScreenshotStoppedOverlay();
                            }
                            break;
                        case 'screenshot_stopped':
                            // 截图流传输停止的醒目提示
                            log(msg.message || '📷 图片流传输已停止', 'warn');
                            this.showScreenshotStoppedOverlay();
                            break;
                        case 'error':
                            log(`错误: ${msg.message}`, 'error');
                            setAllScriptsPending(false);
                            if (msg.type === 'robot_error') {
                                this.updateRobotState('stopped');
                            }
                            break;
                    }
                } catch (e) {
                    console.error('[WebSocket] 解析消息失败:', e);
                    setAllScriptsPending(false);
                }
            }

            showScreenshotStoppedOverlay() {
                // 显示截图停止的醒目提示覆盖层
                const phoneScreen = document.querySelector('.phone-screen');
                if (!phoneScreen) return;
                
                // 检查是否已有覆盖层
                let overlay = document.getElementById('screenshotStoppedOverlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'screenshotStoppedOverlay';
                    overlay.className = 'screenshot-stopped-overlay';
                    overlay.innerHTML = `
                        <div class="stopped-content">
                            <div class="stopped-icon">📷</div>
                            <div class="stopped-text">图片流传输已停止</div>
                            <div class="stopped-subtext">启动机器人以恢复画面</div>
                        </div>
                    `;
                    phoneScreen.appendChild(overlay);
                }
                overlay.style.display = 'flex';
            }

            hideScreenshotStoppedOverlay() {
                // 隐藏截图停止提示
                const overlay = document.getElementById('screenshotStoppedOverlay');
                if (overlay) {
                    overlay.style.display = 'none';
                }
            }

            sendControl(action, params = {}) {
                if (this.ws?.readyState !== WebSocket.OPEN) {
                    log('连接未就绪，无法发送控制指令', 'error');
                    return false;
                }
                const msg = { type: 'control', action, params };
                this.ws.send(JSON.stringify(msg));
                log(`发送控制指令: ${action}`, 'info');
                return true;
            }

            updateStatus() {
                const statusEl = document.getElementById('connStatus');
                const dotEl = document.getElementById('statusDot');
                const fpsBadge = document.getElementById('fpsBadge');
                const btn = document.getElementById('connectBtn');
                const robotBtn = document.getElementById('robotBtn');

                dotEl.className = 'status-dot w-2 h-2 rounded-full';

                switch (this.connectionState) {
                    case 'connected':
                        statusEl.textContent = '已连接';
                        statusEl.style.color = '#4ade80';
                        dotEl.classList.add('bg-success');
                        fpsBadge.classList.remove('hidden');
                        btn.textContent = '断开连接';
                        btn.disabled = false;
                        enableControls(true);
                        robotBtn.disabled = false;
                        break;
                    case 'connecting':
                        statusEl.textContent = '连接中...';
                        statusEl.style.color = '#fbbf24';
                        dotEl.classList.add('bg-warning', 'animate-pulse');
                        fpsBadge.classList.add('hidden');
                        btn.textContent = '连接中...';
                        btn.disabled = true;
                        enableControls(false);
                        robotBtn.disabled = true;
                        break;
                    case 'error':
                        statusEl.textContent = '连接错误';
                        statusEl.style.color = '#ef4444';
                        dotEl.classList.add('bg-danger');
                        fpsBadge.classList.add('hidden');
                        btn.textContent = '重新连接';
                        btn.disabled = false;
                        enableControls(false);
                        robotBtn.disabled = true;
                        break;
                    default:
                        statusEl.textContent = '未连接';
                        statusEl.style.color = 'rgba(255,255,255,0.5)';
                        dotEl.classList.add('bg-danger');
                        fpsBadge.classList.add('hidden');
                        btn.textContent = '连接服务器';
                        btn.disabled = false;
                        enableControls(false);
                        robotBtn.disabled = true;
                }
                this.updateRobotBtnStatus();
            }
        }

        // ==================== 日志功能 ====================
        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];

            const entry = document.createElement('div');
            entry.className = 'log-entry py-1 border-b border-white/5';
            entry.innerHTML = `
                <span class="log-time text-white/40 mr-2">${time}</span>
                <span class="log-${type} text-${type === 'info' ? 'info' : type === 'success' ? 'success' : type === 'warn' ? 'warning' : 'danger'}">${message}</span>
            `;

            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function enableControls(enabled) {
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.disabled = !enabled;
            });
        }

        function updateScriptCardStatus(scriptsStatus) {
            Object.entries(scriptsStatus).forEach(([scriptName, isActive]) => {
                const card = document.querySelector(`[data-script="${scriptName}"]`);
                if (!card) return;

                // 移除 pending 状态
                card.classList.remove('script-pending');
                const content = card.querySelector('.script-card-content');
                if (content) content.style.pointerEvents = 'auto';

                if (isActive) {
                    // 激活状态
                    card.classList.add('active', 'bg-primary/10', 'border-borderPrimary', 'script-active');
                    card.classList.remove('bg-cardBg', 'border-transparent');
                    // 添加勾选标记（如果不存在）
                    if (!card.querySelector('.check-mark')) {
                        const checkMark = document.createElement('div');
                        checkMark.className = 'check-mark absolute right-3 top-1/2 -translate-y-1/2 text-success text-sm pointer-events-none';
                        checkMark.textContent = '✓';
                        card.appendChild(checkMark);
                    }
                } else {
                    // 非激活状态
                    card.classList.remove('active', 'bg-primary/10', 'border-borderPrimary', 'script-active');
                    card.classList.add('bg-cardBg', 'border-transparent');
                    // 移除勾选标记
                    const checkMark = card.querySelector('.check-mark');
                    if (checkMark) checkMark.remove();
                }
            });
        }

        // ==================== 配置编辑器 ====================
        
        // 配置数据结构
        let configData = {
            keys: []
        };
        let currentEditingKeyId = null;
        
        function openConfig(skillName) {
            currentConfigSkill = skillName;
            document.getElementById('configSkillName').textContent = skillName;
            
            // 初始化空配置或加载现有配置
            configData = { keys: [] };
            currentEditingKeyId = null;
            
            // 从后端加载配置
            loadSkillConfig(skillName);
            
            const modal = document.getElementById('configModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfig() {
            const modal = document.getElementById('configModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            currentConfigSkill = null;
            currentEditingKeyId = null;
            configData = { keys: [] };
        }

        function loadSkillConfig(skillName) {
            // 记录当前选中的 key 名称（用于加载后恢复选中状态）
            const currentKeyName = currentEditingKeyId ? 
                configData.keys.find(k => k.id === currentEditingKeyId)?.name : null;
            
            const retData = req.getSync(`/base/skill_config?skill_name=${encodeURIComponent(skillName)}`);
            if (retData && retData.code === 2000) {
                // 直接使用后端返回的配置数据（已是新格式）
                const backendConfig = retData.data.config || {};
                if (backendConfig.keys && Array.isArray(backendConfig.keys)) {
                    // 为每个 key 添加唯一 id（如果没有的话）
                    configData.keys = backendConfig.keys.map((k, index) => ({
                        ...k,
                        id: k.id || `key_${index}_${Date.now()}`
                    }));
                    
                    // 尝试根据名称恢复选中状态
                    if (currentKeyName) {
                        const matchedKey = configData.keys.find(k => k.name === currentKeyName);
                        if (matchedKey) {
                            currentEditingKeyId = matchedKey.id;
                        }
                    }
                } else {
                    // 兼容旧格式（如果有的话）
                    configData.keys = [];
                }
            }
            
            renderKeyList();
            renderEditor();
            renderHistory();
        }

        // 渲染左侧键名列表
        function renderKeyList() {
            const container = document.getElementById('keyList');
            container.innerHTML = '';
            
            if (configData.keys.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 px-4">
                        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-[#252a3d] flex items-center justify-center">
                            <svg class="w-5 h-5 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                        </div>
                        <p class="text-white/30 text-xs">暂无配置项</p>
                        <p class="text-white/20 text-[11px] mt-1">点击右上方「新建」按钮</p>
                    </div>
                `;
                return;
            }
            
            configData.keys.forEach(key => {
                const item = document.createElement('div');
                const isActive = key.id === currentEditingKeyId;
                item.className = `group px-3 py-2.5 rounded-lg cursor-pointer transition-all border ${isActive ? 'bg-[#6366f1]/10 border-[#6366f1]/30' : 'bg-transparent border-transparent hover:bg-white/5 hover:border-[#3d4252]'}`;
                item.onclick = () => selectKey(key.id);
                
                const typeColor = key.type === 'text' ? 'bg-[#10b981]/20 text-[#10b981]' : 'bg-[#f59e0b]/20 text-[#f59e0b]';
                const typeLabel = key.type === 'text' ? '文本' : '键值';
                
                item.innerHTML = `
                    <div class="flex items-start gap-2">
                        <span class="mt-0.5 w-1.5 h-1.5 rounded-full ${key.type === 'text' ? 'bg-[#10b981]' : 'bg-[#f59e0b]'} flex-shrink-0"></span>
                        <div class="flex-1 min-w-0">
                            <div class="text-[13px] font-medium ${isActive ? 'text-white' : 'text-white/80 group-hover:text-white'} truncate">${escapeHtml(key.name)}</div>
                            ${key.description ? `<div class="text-[11px] text-white/40 truncate mt-0.5">${escapeHtml(key.description)}</div>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 选择键值进行编辑
        function selectKey(keyId) {
            currentEditingKeyId = keyId;
            renderKeyList();
            renderEditor();
            renderHistory();
        }

        // 渲染中间编辑区
        function renderEditor() {
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            const header = document.getElementById('editorHeader');
            const footer = document.getElementById('editorFooter');
            const emptyEditor = document.getElementById('emptyEditor');
            const textEditor = document.getElementById('textEditor');
            const objectEditor = document.getElementById('objectEditor');
            
            if (!key) {
                header.classList.add('hidden');
                footer.classList.add('hidden');
                emptyEditor.classList.remove('hidden');
                textEditor.classList.add('hidden');
                objectEditor.classList.add('hidden');
                return;
            }
            
            header.classList.remove('hidden');
            footer.classList.remove('hidden');
            emptyEditor.classList.add('hidden');
            
            // 填充头部信息
            document.getElementById('currentKeyName').value = key.name;
            document.getElementById('currentKeyDesc').value = key.description || '';
            const typeEl = document.getElementById('currentKeyType');
            if (key.type === 'text') {
                typeEl.textContent = 'TEXT';
                typeEl.className = 'px-2.5 py-1 rounded-md text-[10px] font-semibold tracking-wider bg-[#10b981]/15 text-[#10b981] border border-[#10b981]/20';
            } else {
                typeEl.textContent = 'KV';
                typeEl.className = 'px-2.5 py-1 rounded-md text-[10px] font-semibold tracking-wider bg-[#f59e0b]/15 text-[#f59e0b] border border-[#f59e0b]/20';
            }
            
            // 根据类型渲染编辑器
            if (key.type === 'text') {
                textEditor.classList.remove('hidden');
                objectEditor.classList.add('hidden');
                document.getElementById('textValue').value = key.current_value || '';
            } else {
                textEditor.classList.add('hidden');
                objectEditor.classList.remove('hidden');
                renderKVEditor(key.current_value || {});
            }
        }

        // 渲染键值对编辑器
        function renderKVEditor(obj) {
            const container = document.getElementById('kvList');
            container.innerHTML = '';
            
            Object.entries(obj).forEach(([k, v]) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 p-2 bg-[#1a1d29] rounded-lg border border-[#2d3142] group focus-within:border-[#6366f1]/30 transition-colors';
                // 使用键名作为删除标识，避免索引添加问题
                const escapedKey = escapeHtml(k).replace(/'/g, "\\'").replace(/"/g, '\\"');
                row.innerHTML = `
                    <input type="text" class="kv-key flex-1 px-3 py-2 bg-[#252a3d] border border-[#3d4252] rounded-md text-[13px] text-white/90 focus:border-[#6366f1]/50 focus:outline-none transition-colors placeholder-white/20" 
                           value="${escapeHtml(k)}" placeholder="键名">
                    <span class="text-white/20">:</span>
                    <input type="text" class="kv-value flex-1 px-3 py-2 bg-[#252a3d] border border-[#3d4252] rounded-md text-[13px] text-white/90 focus:border-[#6366f1]/50 focus:outline-none transition-colors placeholder-white/20" 
                           value="${escapeHtml(String(v))}" placeholder="值">
                    <button onclick="removeKVPair('${escapedKey}')" class="w-8 h-8 flex items-center justify-center text-white/30 hover:text-[#ef4444] hover:bg-[#ef4444]/10 rounded-md transition-all opacity-0 group-hover:opacity-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        // 渲染历史记录
        function renderHistory() {
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            const container = document.getElementById('historyList');
            const emptyHistory = document.getElementById('emptyHistory');
            
            container.innerHTML = '';
            container.appendChild(emptyHistory);
            
            if (!key || !key.history || key.history.length === 0) {
                emptyHistory.classList.remove('hidden');
                return;
            }
            
            emptyHistory.classList.add('hidden');
            
            key.history.forEach((item, index) => {
                // 【修改】适配后端历史记录格式
                // 后端格式: {created_at: "...", "目标视频描述": "...", ...}
                // 前端需要: {timestamp: "...", preview: "...", value: "..."}
                const timestamp = item.created_at || item.timestamp;
                const value = item[key.name]; // 使用当前key的名称从历史记录中获取值
                const preview = generatePreview(value);
                
                const historyItem = document.createElement('div');
                historyItem.className = 'p-3 bg-[#252a3d] rounded-lg border border-[#2d3142] hover:border-[#3d4252] transition-all group';
                historyItem.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] text-white/40 font-mono">${formatTime(timestamp)}</span>
                        <button onclick="deleteHistory(${index})" class="text-white/20 hover:text-[#ef4444] transition-colors opacity-0 group-hover:opacity-100">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="text-[12px] text-white/60 mb-3 line-clamp-2 leading-relaxed">${escapeHtml(preview)}</div>
                    <button onclick="loadHistory(${index})" class="w-full px-3 py-1.5 bg-[#6366f1]/10 text-[#818cf8] rounded-md text-[11px] hover:bg-[#6366f1]/20 transition-all flex items-center justify-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        恢复此版本
                    </button>
                `;
                container.appendChild(historyItem);
            });
        }

        // 显示新增键值菜单
        function showAddKeyMenu() {
            const menu = document.getElementById('addKeyMenu');
            menu.classList.toggle('hidden');
        }

        // 新增键值
        function addNewKey(type) {
            document.getElementById('addKeyMenu').classList.add('hidden');
            
            const newKey = {
                id: `key_${Date.now()}`,
                name: type === 'text' ? '新文本配置' : '新键值对',
                description: '',
                type: type,
                current_value: type === 'text' ? '' : {},
                history: []
            };
            
            configData.keys.push(newKey);
            selectKey(newKey.id);
            renderKeyList();
        }

        // 删除当前键值
        function deleteCurrentKey() {
            if (!currentEditingKeyId) return;
            
            if (!confirm('确定要删除这个配置项吗？')) return;
            
            configData.keys = configData.keys.filter(k => k.id !== currentEditingKeyId);
            currentEditingKeyId = null;
            
            renderKeyList();
            renderEditor();
            renderHistory();
        }

        // 添加键值对
        function addKVPair() {
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            if (!key || key.type !== 'object') return;
            
            key.current_value = key.current_value || {};
            const newKey = `新键_${Object.keys(key.current_value).length + 1}`;
            key.current_value[newKey] = '';
            
            renderKVEditor(key.current_value);
        }

        // 删除键值对
        function removeKVPair(keyName) {
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            if (!key || key.type !== 'object') return;
            
            if (key.current_value && keyName in key.current_value) {
                delete key.current_value[keyName];
            }
            
            renderKVEditor(key.current_value);
        }

        // 保存当前配置
        function saveCurrentConfig() {
            if (!currentConfigSkill || !currentEditingKeyId) return;
            
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            if (!key) return;
            
            // 先获取最新值
            key.name = document.getElementById('currentKeyName').value || key.name;
            key.description = document.getElementById('currentKeyDesc').value;
            
            let newValue;
            if (key.type === 'text') {
                newValue = document.getElementById('textValue').value;
            } else {
                const kvInputs = document.querySelectorAll('#kvList > div');
                const newObj = {};
                kvInputs.forEach(div => {
                    const kInput = div.querySelector('.kv-key');
                    const vInput = div.querySelector('.kv-value');
                    if (kInput && vInput && kInput.value.trim()) {
                        newObj[kInput.value.trim()] = vInput.value;
                    }
                });
                newValue = newObj;
            }
            
            // 如果值发生变化，将旧值移入历史
            const oldValueStr = JSON.stringify(key.current_value);
            const newValueStr = JSON.stringify(newValue);
            if (oldValueStr !== newValueStr && key.current_value !== undefined && key.current_value !== '') {
                key.history = key.history || [];
                // 【修改】适配后端历史记录格式
                // 后端格式: {id, name, created_at, [key.name]: value, ...}
                const historyItem = {
                    id: `hist_${Date.now().toString(36).substr(-6)}`,
                    name: `历史_${Date.now().toString(36).substr(-6)}`,
                    created_at: new Date().toISOString(),
                    [key.name]: JSON.parse(JSON.stringify(key.current_value))  // 使用key.name作为字段名
                };
                key.history.unshift(historyItem);
                if (key.history.length > 10) {
                    key.history = key.history.slice(0, 10);
                }
            }
            
            key.current_value = newValue;
            
            // 构建完整的配置数据（包含类型和历史）
            const backendConfig = {
                keys: configData.keys.map(k => ({
                    name: k.name,
                    description: k.description,
                    type: k.type,
                    current_value: k.current_value,
                    history: k.history || []
                }))
            };
            
            const retData = req.postSync('/base/skill_config/save', {
                skill_name: currentConfigSkill,
                config: backendConfig
            });
            
            if (retData && retData.code === 2000) {
                skillConfigs[currentConfigSkill] = backendConfig;
                const saveStatus = document.getElementById('saveStatus');
                saveStatus.classList.remove('hidden');
                setTimeout(() => saveStatus.classList.add('hidden'), 2000);
                
                renderKeyList();
                renderHistory();
                log(`配置已保存: ${key.name}`, 'success');
            } else {
                log('保存配置失败', 'error');
            }
        }

        // 加载历史版本
        function loadHistory(historyIndex) {
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            if (!key || !key.history[historyIndex]) return;
            
            if (!confirm('加载此历史版本将覆盖当前内容，是否继续？')) return;
            
            // 【修改】适配后端历史记录格式
            // 从历史记录中使用key.name获取对应的值
            const historyItem = key.history[historyIndex];
            const value = historyItem[key.name];
            key.current_value = JSON.parse(JSON.stringify(value));
            renderEditor();
            log('已加载历史版本', 'info');
        }

        // 删除历史记录
        function deleteHistory(historyIndex) {
            const key = configData.keys.find(k => k.id === currentEditingKeyId);
            if (!key) return;
            
            key.history.splice(historyIndex, 1);
            renderHistory();
        }

        // 生成预览文本
        function generatePreview(value) {
            if (typeof value === 'string') {
                return value.substring(0, 100);
            } else if (typeof value === 'object') {
                const entries = Object.entries(value);
                if (entries.length === 0) return '空对象';
                return entries.map(([k, v]) => `${k}: ${String(v).substring(0, 30)}`).join(', ');
            }
            return String(value).substring(0, 100);
        }

        // 格式化时间
        function formatTime(isoString) {
            if (!isoString) return '--';
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 点击弹窗外部或按钮关闭菜单
        document.getElementById('configModal').addEventListener('click', (e) => {
            if (e.target.id === 'configModal') {
                closeConfig();
            }
            // 关闭新增菜单
            if (!e.target.closest('#addKeyMenu') && !e.target.closest('[onclick="showAddKeyMenu()"]')) {
                document.getElementById('addKeyMenu').classList.add('hidden');
            }
        });

        // ==================== 初始化 ====================
        const wsClient = new WebSocketClient(`ws://${localHost}:8765`);

        let currentBlobUrl = null;
        wsClient.onScreenshot = (blob) => {
            const img = document.getElementById('screenshotImg');
            const noConn = document.getElementById('noConnection');

            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }

            currentBlobUrl = URL.createObjectURL(blob);
            img.src = currentBlobUrl;
            img.classList.remove('hidden');
            noConn.classList.add('hidden');
        };

        wsClient.onControlResult = (result) => {
            const el = document.getElementById('controlResult');
            el.textContent = result.status === 'success'
                ? `✓ ${result.action}`
                : `✗ ${result.action}`;
            el.classList.add('opacity-100');

            setTimeout(() => {
                el.classList.remove('opacity-100');
            }, 3000);
        };

        wsClient.onScriptStatusUpdate = (scriptsStatus) => {
            updateScriptCardStatus(scriptsStatus);
        };

        wsClient.onRobotStatusUpdate = (state) => {
            const robotBtn = document.getElementById('robotBtn');
            if (!robotBtn) return;

            switch (state) {
                case 'running':
                    log('机器人已启动', 'success');
                    break;
                case 'stopped':
                    log('机器人已停止', 'info');
                    break;
                case 'starting':
                    log('机器人启动中...', 'warn');
                    break;
                case 'stopping':
                    log('机器人停止中...', 'warn');
                    break;
            }
        };

        // 事件绑定
        document.getElementById('connectBtn').addEventListener('click', () => {
            if (wsClient.connectionState === 'connected') {
                wsClient.disconnect();
            } else {
                wsClient.connect();
            }
        });

        document.getElementById('robotBtn').addEventListener('click', () => {
            const currentState = wsClient.robotState;
            if (currentState === 'stopped') {
                wsClient.sendStartRobotCmd();
            } else if (currentState === 'running') {
                wsClient.sendStopRobotCmd();
            }
        });

        document.getElementById('btnBack').addEventListener('click', () => {
            wsClient.sendControl('back');
        });

        document.getElementById('btnHome').addEventListener('click', () => {
            wsClient.sendControl('home');
        });

        document.getElementById('btnRecent').addEventListener('click', () => {
            wsClient.sendControl('recent');
        });

        document.getElementById('btnScreenshot').addEventListener('click', () => {
            wsClient.sendControl('screenshot');
        });

        document.getElementById('refreshSkillsBtn').addEventListener('click', () => {
            loadSkills()
        });

        window.addEventListener('beforeunload', () => {
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }
            wsClient.disconnect();
        });

        function updateConnectMsg(msg){
            document.getElementById('connectMsg').innerHTML = msg
        }

        // 技能列表分页配置
        const SKILLS_PER_PAGE = 10;
        let skillsCurrentPage = 1;
        let skillsHasMore = true;
        let skillsLoading = false;
        let allSkills = [];

        function fetchSkills(page=1, perPage=SKILLS_PER_PAGE, forceFetch=false) {
            let data = {page: page, per_page: perPage}
            if (forceFetch){
                data.force_fetch = forceFetch
            }
            let retData = req.getSync('/base/skills', data)
            if (retData.code === 2000){
                return retData.data
            }
            return [];
        }

        function loadSkills(forceFetch=false){
            const scriptListEl = document.getElementById('scriptList')
            
            // 重置分页状态
            if (forceFetch) {
                skillsCurrentPage = 1;
                skillsHasMore = true;
                allSkills = [];
            }
            
            if (!skillsHasMore || skillsLoading) return;
            
            skillsLoading = true;
            scriptListEl.dataset.loading = 'true';
            
            let skillList = fetchSkills(skillsCurrentPage, SKILLS_PER_PAGE, forceFetch)
            
            if (skillList.length < SKILLS_PER_PAGE) {
                skillsHasMore = false;
            }
            
            allSkills = allSkills.concat(skillList);
            
            // 渲染技能列表
            renderSkills(skillList, skillsCurrentPage === 1);
            
            skillsCurrentPage++;
            skillsLoading = false;
            scriptListEl.dataset.loading = 'false';
        }
        
        function renderSkills(skillList, isFirstPage){
            const scriptListEl = document.getElementById('scriptList')
            
            let html = ''
            for (let i in skillList){
                let skill_data = skillList[i]
                const isActive = skill_data.是否激活;
                html += `
                    <div class="group relative flex items-start gap-2 ${isActive ? 'bg-primary/10 border-borderPrimary' : 'bg-cardBg border-transparent'} rounded-lg p-3 border hover:border-borderPrimaryLight cursor-pointer transition-all script-card ${isActive ? 'active script-active' : ''}" data-script="${skill_data.group_name}">
                        <div class="script-card-content flex-1 min-w-0" data-script="${skill_data.group_name}">
                            <div class="flex items-center justify-between mb-1">
                                <span class="script-name text-sm font-medium truncate">${skill_data.group_name}</span>
                            </div>
                            <div class="text-xs text-white/50 truncate">${skill_data.描述 || '暂无描述'}</div>
                        </div>
                        <button onclick="event.stopPropagation(); openConfig('${skill_data.group_name}')" class="config-btn p-1.5 hover:bg-white/10 rounded flex-shrink-0" title="配置">
                            <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                        ${isActive ? '<div class="check-mark absolute right-3 top-1/2 -translate-y-1/2 text-success text-sm pointer-events-none">✓</div>' : ''}
                    </div>
                `
            }
            // 如果是第一页，清空列表；否则追加
            if (isFirstPage) {
                scriptListEl.innerHTML = html;
            } else {
                // 创建一个临时容器解析HTML并添加到列表
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                while (tempDiv.firstChild) {
                    scriptListEl.appendChild(tempDiv.firstChild);
                }
            }
            
            // 绑定事件到新添加的卡片
            bindSkillCardEvents();
        }
        
        function bindSkillCardEvents() {
            // 脚本卡片点击事件 - 绑定到内容区域
            document.querySelectorAll('.script-card-content:not([data-bound="true"])').forEach(content => {
                content.dataset.bound = 'true'; // 标记已绑定
                
                content.addEventListener('click', (e) => {
                    // 如果点击的是配置按钮或其子元素，不处理
                    if (e.target.closest('.config-btn')) {
                        return;
                    }
                    
                    const card = content.closest('.script-card');
                    const scriptName = card.dataset.script;
                    const scriptDisplayName = content.querySelector('.script-name').textContent;
                    
                    // 禁用状态下不允许切换
                    if (card.classList.contains('script-disabled')) {
                        return;
                    }
                    
                    // 如果正在等待服务器响应，忽略本次点击
                    if (card.classList.contains('script-pending')) {
                        return;
                    }
                    
                    if (wsClient.connectionState !== 'connected') {
                        // 未连接状态：本地切换显示状态
                        const isActive = card.classList.contains('active');
                        if (isActive) {
                            card.classList.remove('active', 'bg-primary/10', 'border-borderPrimary', 'script-active');
                            log(`取消选中脚本: ${scriptDisplayName}（未连接，仅本地状态）`, 'info');
                        } else {
                            card.classList.add('active', 'bg-primary/10', 'border-borderPrimary', 'script-active');
                            log(`选中脚本: ${scriptDisplayName}（未连接，仅本地状态）`, 'info');
                        }
                        return;
                    }

                    // 已连接状态：进入 pending 状态，等待服务器确认
                    const willBeActive = !card.classList.contains('active');
                    card.classList.add('script-pending');
                    content.style.pointerEvents = 'none';

                    wsClient.sendSingleScriptStatus(scriptName, willBeActive);

                    if (willBeActive) {
                        log(`请求启用脚本: ${scriptDisplayName}（等待服务器确认）`, 'info');
                    } else {
                        log(`请求禁用脚本: ${scriptDisplayName}（等待服务器确认）`, 'info');
                    }
                    // 注意：不在此更新 UI 状态，等待服务器返回后通过 updateScriptCardStatus 更新
                });
            });
        }
        
        // 技能列表滚动监听
        function setupSkillListScroll() {
            const scriptListEl = document.getElementById('scriptList');
            if (!scriptListEl) return;
            
            scriptListEl.addEventListener('scroll', () => {
                const { scrollTop, scrollHeight, clientHeight } = scriptListEl;
                // 当滚动到距离底部 50px 时加载更多
                if (scrollTop + clientHeight >= scrollHeight - 50) {
                    if (!skillsLoading && skillsHasMore) {
                        loadSkills();
                    }
                }
            })
        }

        document.addEventListener('DOMContentLoaded', async () => {
            updateNavLinks();
            // 更新所有内部链接
            document.querySelectorAll('.internal-link').forEach(link => {
                const originalHref = link.getAttribute('href');
                link.href = getUrlWithSn(originalHref);
            });
            // 更新所有非导航链接
            document.querySelectorAll('a[href^="/base/"]:not(.nav-link):not(.internal-link)').forEach(link => {
                const originalHref = link.getAttribute('href');
                if (!originalHref.includes('?')) {
                    link.href = getUrlWithSn(originalHref);
                }
            });
            
            // 检查用户权限（未登录或非 VIP 会自动跳转）
            await checkUserAccess({
                onSuccess: (user) => {
                    // 检查通过，继续加载页面内容
                    loadUserInfoDisplay();
                    loadSkills();
                    setAllScriptsDisabled();
                    setupSkillListScroll();
                }
            });
        })

        log('页面加载完成，点击"连接服务器"开始使用', 'info');
    </script>
    {% include 'common/user_check.html' %}
</body>
</html>
