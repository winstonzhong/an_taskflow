[pytest]
DJANGO_SETTINGS_MODULE = an_taskflow.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --reuse-db
    --tb=short
    -v
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    scheduler: 调度相关测试
    worker: Worker 相关测试
    lifecycle: 生命周期测试
    error: 异常处理测试
    signal: 信号处理测试 (Ctrl+C)
    queue: 队列系统测试
